<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Focus Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-wrap">
    <section class="timer-card" aria-label="Pomodoro timer">
      <header class="timer-header">
        <h1>Study Pomodoro</h1>
        <div class="mode-tabs" role="tablist" aria-label="Timer mode">
          <button type="button" id="mode-work" class="mode-btn active" role="tab" aria-selected="true">Focus</button>
          <button type="button" id="mode-break" class="mode-btn" role="tab" aria-selected="false">Break</button>
        </div>
      </header>

      <!-- SVG circular progress indicator -->
      <div class="ring-wrap">
        <svg class="progress-ring" width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-bg" cx="110" cy="110" r="96"></circle>
          <circle class="ring-fg" id="ring-progress" cx="110" cy="110" r="96"></circle>
        </svg>
        <div class="time-display" id="time-display" aria-live="polite">25:00</div>
      </div>

      <div class="controls-row">
        <button type="button" id="start-pause-btn" class="btn-main">Start</button>
        <button type="button" id="reset-btn" class="btn-sub">Reset</button>
        <button type="button" id="notify-btn" class="btn-sub">Enable Alerts</button>
      </div>

      <p class="shortcut-hint">Shortcuts: <kbd>Space</kbd> Start/Pause • <kbd>R</kbd> Reset • <kbd>M</kbd> Switch Mode</p>

      <!-- custom interval settings -->
      <div class="settings-row">
        <label>
          Focus (min)
          <input type="number" id="work-mins" min="1" max="90" value="25">
        </label>
        <label>
          Break (min)
          <input type="number" id="break-mins" min="1" max="45" value="5">
        </label>
      </div>
    </section>

    <!-- persisted session log -->
    <section class="log-card" aria-labelledby="log-heading">
