<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Focus Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-wrap">
    <section class="timer-card" aria-label="Pomodoro timer">
      <header class="timer-header">
        <h1>Study Pomodoro</h1>
        <div class="mode-tabs" role="tablist" aria-label="Timer mode">
          <button type="button" id="mode-work" class="mode-btn active" role="tab" aria-selected="true">Focus</button>
          <button type="button" id="mode-break" class="mode-btn" role="tab" aria-selected="false">Break</button>
        </div>
      </header>
